name: CI

on:
  # Only the default branch on push — pull_request already covers branches with
  # an open PR, and listening to both fires two identical runs per push.
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Least privilege for GITHUB_TOKEN: CI only ever needs to read the code.
# Without this, a public repo's default token is read/write on most scopes.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v7
        with:
          # Don't leave the job token in .git/config; nothing here pushes.
          persist-credentials: false

      - name: Swift version
        run: swift --version

      - name: Build
        run: swift build --build-tests

      - name: Test
        run: swift test

  bundle:
    name: Build app bundle
    runs-on: macos-14
    steps:
      # Full history so CFBundleVersion (the commit count) is meaningful.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Build Caffeinate UI.app
        run: ./scripts/build.sh --universal

      - name: Verify the bundle
        run: |
          APP="build/Caffeinate UI.app"
          test -x "$APP/Contents/MacOS/CaffeinateUI"
          test -f "$APP/Contents/Resources/AppIcon.icns"
          /usr/libexec/PlistBuddy -c "Print :CFBundleIdentifier" "$APP/Contents/Info.plist"
          /usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" "$APP/Contents/Info.plist"
          lipo -info "$APP/Contents/MacOS/CaffeinateUI"
          codesign --verify --verbose "$APP"

      - uses: actions/upload-artifact@v7
        with:
          name: Caffeinate-UI-app
          path: build/Caffeinate UI.app
          if-no-files-found: error
